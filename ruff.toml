# Ruff — guardrail tối thiểu, ghim tại repo để kết quả không phụ thuộc máy/phiên bản ruff.
# Chọn đúng nhóm bắt lỗi cơ học (import thừa/biến thừa/tên chưa định nghĩa/lỗi cú pháp),
# KHÔNG bật rule phong cách gây nhiễu diff (chấm dấu phẩy, độ dài dòng...).
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
# E402 (import sau sys.path.insert) đã được đánh dấu # noqa: E402 ở các CLI trong tools/

[lint.per-file-ignores]
# CLI phải chèn REPO_ROOT vào sys.path trước khi import src.* → E402 hợp lệ
"tools/*.py" = ["E402"]
