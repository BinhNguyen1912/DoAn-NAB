name: checks

# Guardrail: chặn lỗi cơ học (import thừa, biến thừa, tên chưa định nghĩa, test hỏng)
# trước khi vào main. Chạy làn NHANH (bỏ test "slow" cần checkpoint/model SAM 2).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Cài ruff (đã ghim config trong ruff.toml)
        run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check . --output-format=github

  tests:
    name: pytest (fast lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # src/tracker_engine.py import torch (chỉ cần CPU cho làn nhanh — không build model)
      - name: Cài torch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Cài dependency repo
        run: pip install -r requirements.txt
      # Test slow cần checkpoint SAM 2 (không có trong CI) → chỉ chạy làn nhanh
      - name: pytest -m "not slow"
        run: python -m pytest -m "not slow"
