# Cấu hình mặc định cho run_live.py — chỉ ghi key muốn KHÁC giá trị mặc định.
# Xem src/config.py:DEFAULTS cho danh sách key + ý nghĩa.
# Cách dùng: python tools/run_live.py --config configs/default.yaml --source data/video.mp4
# Các flag CLI (--record, --metrics-csv, --max-trajectory, ...) đè lên giá trị trong file.

checkpoint: samurai/sam2/checkpoints/sam2.1_hiera_tiny.pt   # SAM 2.1 tiny (ADR-0001)
model_cfg: configs/samurai/sam2.1_hiera_t.yaml              # config SAMURAI gốc — giữ nguyên

source: 0                    # 0 = webcam | rtsp://IP:554/stream | data/video.mp4

max_trajectory: 100          # số điểm quỹ đạo tối đa trên HUD (deque giới hạn)

record_enabled: false        # true = ghi mp4 HUD ra record_path
record_path: data/demo_hud.mp4
record_fps: null             # null = lấy từ nguồn (headless) / 30 (display)

metrics_csv: null            # ví dụ data/metrics.csv — bật để ghi số liệu từng frame
metrics_summary: null        # ví dụ data/summary.json — cần metrics_csv

max_frames: null             # null = chạy hết nguồn; đặt số để cắt ngắn demo

# Tối ưu tốc độ trên CPU (tuỳ chọn): reset + chọn lại bbox mỗi N frame.
# null = tắt (memory đầy đủ, chậm dần theo thời gian). N=3 nhanh ~2.2x nhưng đổi chất lượng
# bộ nhớ dài hạn (đo trên fixture: IoU sau che 0.969 vs 0.981, mất dấu 0/19 vs 5/19).
reanchor_every: null

# Độ phân giải đầu vào của model (SAM 2 mặc định 1024). Hạ 512 → nhanh ~5-6x trên CPU
# (đo: 5492ms → 733ms/frame) nhưng vật thể nhỏ có thể kém chính xác hơn.
image_size: null

# Hiển thị MƯỢT (tách luồng): video ~30 FPS, mask/ô bao cập nhật mỗi lần suy luận xong
# và HUD ghi rõ "Overlay: N ms trước". Bật khi demo cần nhìn mượt (dùng với --display).
smooth_display: false
# ---- Tái nhận diện khuôn mặt (ADR-0003 — buổi 6 + buổi 9 đề cương) ----
# Bật: mất dấu thì ĐÓNG BĂNG (không bám sang người khác trong khung), khi đối tượng
# quay lại thì tự bám lại đúng người nhờ so khớp embedding khuôn mặt (YuNet + SFace).
# Tắt: hành vi cũ (bám liên tục, chỉ cảnh báo khi ô bao nhảy xa).
# Lưu ý: cần model trong models/face/ (xem docs/adr/0003). Không dùng chung với --smooth.
reid_enabled: true
reid_detector_model: models/face/face_detection_yunet_2023mar.onnx
reid_recognizer_model: models/face/face_recognition_sface_2021dec.onnx
# Ngưỡng cosine: 0.363 là khuyến nghị tài liệu OpenCV, NHƯNG phải hiệu chỉnh trên video thật
# (đo: cùng 1 người, mặt nhỏ 42x62px, cosine so một mốc chỉ 0.20–0.72 → ADR-0003).
reid_threshold: 0.363
lost_after_frames: 2        # mask rỗng liên tiếp bao nhiêu frame thì đóng băng
reid_min_face_px: 40        # cạnh nhỏ nhất của ô mặt để dùng làm mẫu/ứng viên
reid_min_detect_score: 0.8  # điểm phát hiện mặt tối thiểu
reid_ref_max: 8             # số mẫu tham chiếu giữ lại (lấy max cosine trên toàn tập)

# ---- Tái nhận diện VẬT THỂ (ticket 10) — cho vật KHÔNG có khuôn mặt (remote TV...) ----
# cue: face (chỉ mặt, hành vi cũ) | object (chỉ đặc trưng vật thể) | both (thử mặt trước)
# Cơ chế: lưu vector covariance+HSV của vùng mask khi đang bám; khi mất dấu thì lọc ứng viên
# rẻ bằng NCC trên frame thu nhỏ (top-K) rồi chấm điểm — đo 23,8 ms/frame lost (trước: 845 ms).
reid_cue: face
# Ngưỡng cosine đặc trưng vật thể — KHỞI ĐIỂM, phải hiệu chỉnh trên clip thật (đo fixture:
# cùng vật 1,000; cùng màu khác hoa văn 0,581; khác màu 0,327; hai vật giống y hệt 1,000).
reid_obj_threshold: 0.6
reid_obj_ref_max: 8         # số mẫu đặc trưng vật thể giữ lại
reid_obj_min_side: 24       # cạnh nhỏ nhất của vật để được làm mẫu
reid_obj_min_fill: 0.5      # tỉ lệ mask/ô tối thiểu (chặn vật bị che phần lớn)
reid_obj_top_k: 20          # số ứng viên được chấm descriptor đắt mỗi frame mất dấu
# Cổng NCC cho vật ÍT màu/texture (chai đen...) — 0 = TẮT (mặc định, giữ hành vi cũ).
# Đo thật 27-10: hai vật đen khác nhau → cosine 1,000 (mù) nhưng NCC 0,897; cùng vật NCC 1,000.
# Bật sau khi hiệu chuẩn trên clip thật, ví dụ 0.95.
reid_obj_ncc_min: 0.0
